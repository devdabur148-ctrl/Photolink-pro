<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PicLink Converter Pro</title>
    <style>
        :root { --primary: #00d2ff; --bg: #0f172a; --card: rgba(30, 41, 59, 0.7); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body { background: var(--bg); color: white; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-container {
            width: 100%; max-width: 450px; background: #000; position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.8); display: flex; flex-direction: column; min-height: 100vh;
        }

        header { padding: 20px; text-align: center; border-bottom: 1px solid #333; }
        header h1 { font-size: 1.2rem; color: var(--primary); letter-spacing: 1px; }

        .screen { padding: 20px; flex: 1; overflow-y: auto; }
        .hidden { display: none !important; }

        input {
            width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px;
            border: 1px solid #333; background: #1e293b; color: white; outline: none;
        }

        button {
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: var(--primary); color: black; font-weight: bold; cursor: pointer;
            margin-top: 10px; transition: 0.2s;
        }

        /* Result Area */
        .preview-img { width: 100%; max-height: 200px; object-fit: contain; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
        
        .link-box {
            background: #1e293b; padding: 15px; border-radius: 12px;
            display: flex; align-items: center; justify-content: space-between; border: 1px solid #333;
        }
        #gen-url { font-size: 0.8rem; color: #00d2ff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 70%; }
        .copy-btn { background: #fff; color: #000; padding: 8px 15px; border-radius: 8px; font-size: 0.75rem; width: auto; margin: 0; }

        /* Tabs */
        .tabs { display: flex; background: #111; border-top: 1px solid #333; padding: 12px 0; position: sticky; bottom: 0; }
        .tab { flex: 1; text-align: center; color: #444; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .tab.active { color: var(--primary); }

        .upload-area { border: 2px dashed var(--primary); padding: 40px 20px; border-radius: 20px; text-align: center; margin: 20px 0; cursor: pointer; }
        .draft-card { background: #1e293b; margin-bottom: 12px; padding: 10px; border-radius: 12px; display: flex; gap: 12px; align-items: center; border: 1px solid #333; }
        .draft-card img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }

        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: #000; padding: 10px 20px; border-radius: 8px;
            font-weight: bold; display: none; z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header><h1>PICLINK PRO</h1></header>

        <div id="toast">Link Copied! ✅</div>

        <div id="auth-screen" class="screen">
            <h2>Sign Up</h2>
            <input type="text" id="name" placeholder="Full Name">
            <input type="email" id="email" placeholder="Gmail ID">
            <input type="password" id="pass" placeholder="Password">
            <button onclick="login()">Get Started</button>
        </div>

        <div id="main-app" class="screen hidden">
            <div id="converter-tab">
                <div class="upload-area" onclick="document.getElementById('file-input').click()">
                    <p>📤 Tap to Upload Photo</p>
                    <input type="file" id="file-input" hidden accept="image/*" onchange="processImage(this)">
                </div>

                <div id="result-box" class="hidden">
                    <img id="main-preview" class="preview-img" src="">
                    <div class="link-box">
                        <span id="gen-url">Generating...</span>
                        <button class="copy-btn" onclick="copyLink()">COPY</button>
                    </div>
                    <p style="font-size: 0.7rem; color: #888; margin-top: 10px; text-align: center;">Paste this link in a new tab to see the photo!</p>
                </div>
            </div>

            <div id="drafts-tab" class="hidden">
                <h3 style="margin-bottom: 15px;">Recent Uploads</h3>
                <div id="draft-list"></div>
            </div>
        </div>

        <div id="bottom-tabs" class="tabs">
            <div id="tab-conv" class="tab active" onclick="switchTab('converter')">CONVERTER</div>
            <div id="tab-draft" class="tab" onclick="switchTab('drafts')">DRAFTS</div>
        </div>
    </div>

    <script>
        let drafts = [];
        let currentFullLink = "";

        function login() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
        }

        function switchTab(tab) {
            document.getElementById('converter-tab').classList.toggle('hidden', tab !== 'converter');
            document.getElementById('drafts-tab').classList.toggle('hidden', tab !== 'drafts');
            document.getElementById('tab-conv').classList.toggle('active', tab === 'converter');
            document.getElementById('tab-draft').classList.toggle('active', tab === 'drafts');
        }

        function processImage(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();

                reader.onload = function(e) {
                    const base64Data = e.target.result;
                    
                    // Create a Blob for the link (Better for browser address bar)
                    const blob = dataURLtoBlob(base64Data);
                    currentFullLink = URL.createObjectURL(blob);

                    // Show Preview
                    document.getElementById('main-preview').src = base64Data;
                    document.getElementById('gen-url').innerText = "piclink://" + Math.random().toString(36).substr(2, 7);
                    document.getElementById('result-box').classList.remove('hidden');

                    // Add to Drafts
                    drafts.push({ name: file.name, url: currentFullLink, img: base64Data });
                    updateDrafts();
                };
                reader.readAsDataURL(file);
            }
        }

        // Helper function to convert Base64 to Blob
        function dataURLtoBlob(dataurl) {
            var arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
                bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
            while(n--){ u8arr[n] = bstr.charCodeAt(n); }
            return new Blob([u8arr], {type:mime});
        }

        function copyLink() {
            navigator.clipboard.writeText(currentFullLink).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => toast.style.display = 'none', 2000);
            });
        }

        function updateDrafts() {
            const list = document.getElementById('draft-list');
            list.innerHTML = drafts.map(d => `
                <div class="draft-card" onclick="window.open('${d.url}')">
                    <img src="${d.img}">
                    <div>
                        <p style="font-size:0.8rem; font-weight:bold;">${d.name}</p>
                        <p style="font-size:0.6rem; color:var(--primary);">Tap to View</p>
                    </div>
                </div>
            `).reverse().join('');
        }
    </script>
</body>
</html>
